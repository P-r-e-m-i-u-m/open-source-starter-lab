name: Automation Health

on:
  schedule:
    - cron: "10 3 * * *"  # Runs daily at 3:10 AM UTC
  workflow_dispatch: # Allows manual trigger
    inputs:
      queued_threshold_minutes:
        description: "Flag runs queued longer than this many minutes (default 20)"
        required: false
        type: string

permissions:
  contents: read
  actions: read  # Required to read workflow runs

jobs:
  # ============================================
  # JOB 1: Existing Automation Scripts
  # ============================================
  dry-run-automation:
    name: Dry Run Automation Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Automation health check
        run: npm run automation:health

  # ============================================
  # JOB 2: Queued Workflow Monitor
  # ============================================
  # Separate job on purpose: a stuck run (or an API hiccup) should only
  # produce warnings, never fail the daily health check.
  check-queued-runs:
    name: Check for Stuck Queued Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Flag runs stuck in queued
        env:
          GH_TOKEN: ${{ github.token }}
          # Manual input wins, then the repo variable, then 20 minutes.
          THRESHOLD_MINUTES: ${{ inputs.queued_threshold_minutes || vars.QUEUED_THRESHOLD_MINUTES || '20' }}
        run: |
          set -uo pipefail

          case "$THRESHOLD_MINUTES" in
            ''|*[!0-9]*)
              echo "::warning title=Invalid threshold::'${THRESHOLD_MINUTES}' is not a number, using 20."
              THRESHOLD_MINUTES=20
              ;;
          esac

          # Ask the API for queued runs only, and do the age math in jq.
          if ! rows=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100" \
            | jq -r --argjson limit "$THRESHOLD_MINUTES" '
                .workflow_runs[]
                | ((now - (.created_at | fromdateiso8601)) / 60 | floor) as $age
                | select($age >= $limit)
                | "\(.name // .display_title)\t\(.event)\t\($age)\t\(.html_url)"'); then
            echo "::warning title=Queued-run check skipped::Could not read workflow runs from the GitHub API."
            echo "### ⚠️ Queued-run check skipped (API error)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$rows" ]; then
            echo "No runs queued longer than ${THRESHOLD_MINUTES} min."
            echo "### ✅ No runs queued longer than ${THRESHOLD_MINUTES} min" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### ⚠️ Runs stuck in queued (over ${THRESHOLD_MINUTES} min)"
            echo
            echo "| Workflow | Trigger | Queued | Run |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          count=0
          while IFS=$'\t' read -r name event age url; do
            count=$((count + 1))
            echo "::warning title=Stuck queued run::${name} has been queued for ${age} min: ${url}"
            echo "| ${name} | ${event} | ${age} min | [open](${url}) |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$rows"

          {
            echo
            echo "${count} run(s) flagged. Check [GitHub Status](https://www.githubstatus.com) and runner availability, then cancel and re-run if needed."
            echo
            echo "[View all queued runs](https://github.com/${GITHUB_REPOSITORY}/actions?query=is%3Aqueued)"
          } >> "$GITHUB_STEP_SUMMARY"

          # Warn only. A stuck run must never fail the health check.
          exit 0