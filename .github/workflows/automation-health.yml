name: Automation Health

on:
  schedule:
    - cron: "10 3 * * *"  # Runs daily at 3:10 AM UTC
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: read
  actions: read  # Required to read workflow runs

jobs:
  # ============================================
  # JOB 1: Existing Automation Scripts
  # ============================================
  dry-run-automation:
    name: Dry Run Automation Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Automation health check
        run: npm run automation:health

  # ============================================
  # JOB 2: Queued Workflow Monitor
  # ============================================
  check-queued-runs:
    name: Check for Stuck Queued Workflows
    runs-on: ubuntu-latest
    continue-on-error: true # Don't fail the entire job for a single stuck run
    timeout-minutes: 5

    steps:
      - name: Check for queued runs
        id: queue_check
        run: |
          echo "🔍 Checking for workflows stuck in 'queued' state..."
          echo "============================================================"

          # Filter by status=queued directly from the API to avoid paginating entire run history
          QUEUED_RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?status=queued&per_page=100" \
            --paginate \
            --jq '.workflow_runs[]' 2>/dev/null || true)

          # Check if any runs were returned
          if [ -z "${QUEUED_RUNS//[[:space:]]/}" ]; then
            echo "✅ No queued runs found. All workflows are healthy!"
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "## ✅ Automation Health" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No queued workflows detected." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "⚠️ Found queued runs. Checking their age..."
          echo ""

          # Threshold in minutes (20 minutes)
          THRESHOLD_MINUTES=20
          THRESHOLD_SECONDS=$((THRESHOLD_MINUTES * 60))
          NOW=$(date +%s)

          STUCK_COUNT=0
          WARNING_MESSAGES=""

          # Process each queued run safely as compact single-line JSON
          while IFS= read -r RUN; do
            [ -z "$RUN" ] && continue

            RUN_NAME=$(echo "$RUN" | jq -r '.name // "Unnamed Workflow"')
            RUN_ID=$(echo "$RUN" | jq -r '.id')
            RUN_URL=$(echo "$RUN" | jq -r '.html_url')
            CREATED_AT=$(echo "$RUN" | jq -r '.created_at')

            # Convert created_at ISO 8601 to epoch seconds
            CREATED_EPOCH=$(date -d "$CREATED_AT" +%s 2>/dev/null || date -u +%s)
            AGE=$((NOW - CREATED_EPOCH))
            AGE_MINUTES=$((AGE / 60))

            if [ $AGE -gt $THRESHOLD_SECONDS ]; then
              STUCK_COUNT=$((STUCK_COUNT + 1))
              echo "::warning::Workflow '$RUN_NAME' (run #$RUN_ID) has been queued for ${AGE_MINUTES}m (threshold: ${THRESHOLD_MINUTES}m). URL: $RUN_URL"
              WARNING_MESSAGES="${WARNING_MESSAGES}- [${RUN_NAME} (#${RUN_ID})](${RUN_URL}) — queued for **${AGE_MINUTES} minutes**\n"
            else
              echo "✅ Workflow '$RUN_NAME' (#$RUN_ID) is queued but only ${AGE_MINUTES}m old (under ${THRESHOLD_MINUTES}m threshold)."
            fi
          done < <(echo "$QUEUED_RUNS" | jq -c '.')

          # Output summary to console and Step Summary
          if [ $STUCK_COUNT -gt 0 ]; then
            echo ""
            echo "============================================================"
            echo "::warning::Found $STUCK_COUNT workflow(s) stuck in 'queued' state for over $THRESHOLD_MINUTES minutes."
            echo ""
            echo "📋 Summary of stuck workflows:"
            printf "%b" "$WARNING_MESSAGES"
            echo "============================================================"

            {
              echo "## ⚠️ Stuck Workflows Detected"
              echo ""
              echo "Found **$STUCK_COUNT** workflow(s) queued for more than **$THRESHOLD_MINUTES minutes**:"
              echo ""
              printf "%b\n" "$WARNING_MESSAGES"
              echo "### Recommended Actions"
              echo "- Check if GitHub Actions runners are active and available."
              echo "- Manually review, cancel, or rerun the stuck workflows."
              echo "- [View All Queued Runs](https://github.com/${{ github.repository }}/actions?query=is%3Apr+status%3Aqueued)"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "status=stuck" >> "$GITHUB_OUTPUT"
          else
            echo "✅ All queued runs are within the $THRESHOLD_MINUTES minute threshold."
            {
              echo "## ✅ Automation Health"
              echo ""
              echo "All currently queued workflows are within the **$THRESHOLD_MINUTES minute** threshold."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "status=healthy" >> "$GITHUB_OUTPUT"
          fi

          # Exit 0 so single stuck runs do not fail the overall health check workflow
          exit 0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post summary to job
        run: |
          echo "🏁 Automation health check completed."
          echo ""
          if [ "${{ steps.queue_check.outputs.status }}" == "stuck" ]; then
            echo "⚠️ Some workflows are stuck in the queue. Please investigate."
          else
            echo "✅ All automation health checks passed!"
          fi
